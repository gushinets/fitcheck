name: fitcheck
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${FITCHECK_POSTGRES_DB:-fitcheck}
      POSTGRES_USER: ${FITCHECK_POSTGRES_USER:-fitcheck}
      POSTGRES_PASSWORD: ${FITCHECK_POSTGRES_PASSWORD:?Set database password in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    restart: unless-stopped

  migrate:
    build: ./backend
    image: fitcheck-api:${FITCHECK_RELEASE:-local}
    env_file: ${FITCHECK_API_ENV_FILE:-./ops/env/api.env}
    command: ["/bin/sh", "-ec", "/app/.venv/bin/python -m fitcheck_backend.storage.migrate upgrade && /app/.venv/bin/python -m fitcheck_backend.storage.migrate check"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: fitcheck-api:${FITCHECK_RELEASE:-local}
    env_file: ${FITCHECK_API_ENV_FILE:-./ops/env/api.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backup-state:/var/lib/fitcheck-ops:ro
    expose: ["8000"]
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: fitcheck-worker:${FITCHECK_RELEASE:-local}
    env_file: ${FITCHECK_WORKER_ENV_FILE:-./ops/env/worker.env}
    environment:
      FITCHECK_WORKER_METRICS_HOST: 0.0.0.0
      FITCHECK_WORKER_METRICS_PORT: "9109"
    expose: ["9109"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 140s
    restart: unless-stopped

  website:
    build: .
    image: fitcheck-website:${FITCHECK_RELEASE:-local}
    env_file: ${FITCHECK_WEBSITE_ENV_FILE:-./ops/env/website.env}
    ports:
      - "127.0.0.1:${FITCHECK_WEBSITE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  maintenance:
    image: fitcheck-api:${FITCHECK_RELEASE:-local}
    build: ./backend
    env_file: ${FITCHECK_API_ENV_FILE:-./ops/env/api.env}
    command: ["/app/.venv/bin/python", "-m", "fitcheck_backend.operations", "cleanup", "--dry-run"]
    profiles: ["maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-bookworm
    entrypoint: ["/bin/sh", "/ops/schedule.sh"]
    environment:
      PGSERVICEFILE: /run/secrets/pg_service
      PGSERVICE: fitcheck
      FITCHECK_RESTORE_SERVICE: fitcheck_restore
    secrets: [pg_service]
    volumes:
      - ./ops/backup/backup.sh:/ops/backup.sh:ro
      - ./ops/backup/schedule.sh:/ops/schedule.sh:ro
      - ./ops/backup/verify.sql:/ops/verify.sql:ro
      - backups:/backups
      - backup-state:/state
    profiles: ["operations"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 600s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets: [ops_token]
    ports: ["127.0.0.1:9090:9090"]
    profiles: ["operations"]
    restart: unless-stopped

volumes:
  postgres-data:
  backups:
  backup-state:
  prometheus-data:
secrets:
  pg_service:
    file: ${FITCHECK_PG_SERVICE_FILE:-./ops/backup/pg_service.conf}
  ops_token:
    file: ${FITCHECK_OPS_TOKEN_FILE:-./ops/secrets/ops_token}
