global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fitcheck-api
    metrics_path: /internal/operations/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ops_token
    static_configs:
      - targets: ["api:8000"]
  - job_name: fitcheck-worker
    static_configs:
      - targets: ["worker:9109"]
