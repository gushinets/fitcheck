name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Check native Windows health and graceful shutdown
        run: uv run pytest tests/worker/test_health.py tests/worker/test_cli.py -q

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fitcheck_test
          POSTGRES_USER: fitcheck_test
          POSTGRES_PASSWORD: fitcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitcheck_test -d fitcheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FITCHECK_TEST_DATABASE_URL: postgresql+psycopg://fitcheck_test:fitcheck_test@127.0.0.1:5432/fitcheck_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run backend unit and wheel packaging tests
        run: uv run pytest -m 'not integration' -q

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m integration -q

      - name: Check database schema drift
        env:
          FITCHECK_DATABASE_URL: postgresql+psycopg://fitcheck_test:fitcheck_test@127.0.0.1:5432/fitcheck_test
        run: uv run python -m fitcheck_backend.storage.migrate check

      - name: Check OpenAPI drift
        run: uv run python scripts/export_openapi.py --check

      - name: Build separate worker image
        run: docker build -f Dockerfile.worker -t fitcheck-worker-ci .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend TypeScript drift
        run: pnpm backend:types:check

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Build web application
        run: pnpm exec next build --webpack
