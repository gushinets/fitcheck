name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Scan npm and Python lockfiles
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs .git,node_modules,.next,artifacts,backend/.venv .
      - name: Check Dockerfiles for unsafe configuration
        run: >-
          trivy config --misconfig-scanners dockerfile --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs .git,node_modules,.next,artifacts,backend/.venv .

  gitleaks:
    name: Gitleaks history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with redacted output
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --log-opts=--all

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
