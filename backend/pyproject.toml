[project]
name = "fitcheck-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "uvicorn>=0.32,<1"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7,<1",
    "httpx2>=2.13.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fitcheck_backend"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
