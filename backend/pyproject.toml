[project]
name = "fitcheck-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "beautifulsoup4>=4.13,<5",
    "litellm>=1.80,<2",
    "pydantic-ai-slim>=1,<2",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7,<1",
    "httpx2>=2.13.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fitcheck_backend"]
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "fitcheck_backend/_migrations"
"alembic.ini" = "fitcheck_backend/_migrations/alembic.ini"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires disposable PostgreSQL via FITCHECK_TEST_DATABASE_URL"]
